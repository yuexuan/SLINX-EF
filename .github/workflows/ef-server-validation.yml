name: EF server validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect configured server and stop only this task's build processes
        env:
          DEPLOY_KEY: ${{ secrets.EF_VALIDATION_SSH_KEY }}
          HOST_KEYS: ${{ secrets.EF_VALIDATION_HOST_KEYS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/ef_key
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/ef_key -o BatchMode=yes -o ConnectTimeout=20 root@38.55.195.102 'python3 - <<"PY"
          import pathlib,os,signal
          for p in pathlib.Path("/proc").glob("[0-9]*"):
              try:
                  cwd=(p/"cwd").resolve()
                  name=(p/"comm").read_text().strip()
                  if cwd==pathlib.Path("/root/slinx-ef-build-tools/source") and name in {"go","compile","cc1","gcc"}:
                      os.kill(int(p.name),signal.SIGKILL)
                      print("Stopped task build",p.name,name)
              except (OSError,ValueError): pass
          PY
          systemctl is-active slinx; /etc/slinx/slinx version; free -m'
